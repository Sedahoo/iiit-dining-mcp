[project]
name = "iiit-dining-mcp"
version = "0.1.0"
description = "MCP server for the IIIT Hyderabad Dining Portal (dining.iiit.ac.in)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27",
]

[project.scripts]
iiit-dining-mcp = "iiit_dining_mcp.server:mcp.run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["iiit_dining_mcp"]
